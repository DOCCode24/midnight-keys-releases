name: Publish release from staging branch
on:
  push:
    branches: ['staging/**']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify installer
        run: |
          set -e
          V=$(sed -n 's/^version: //p' latest.yml)
          EXE="MidnightKeys-Setup-$V.exe"
          cat parts/$EXE.part-* > "$EXE"
          WANT=$(sed -n 's/^sha512: //p' latest.yml)
          GOT=$(openssl dgst -sha512 -binary "$EXE" | base64 -w0)
          echo "want $WANT"; echo "got  $GOT"
          [ "$WANT" = "$GOT" ] || { echo "Checksum mismatch"; exit 1; }
          echo "V=$V" >> $GITHUB_ENV; echo "EXE=$EXE" >> $GITHUB_ENV
      - name: Create release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete "v$V" -y --cleanup-tag || true
          gh release create "v$V" "$EXE" "$EXE.blockmap" latest.yml --target main --title "Midnight Keys $V" --notes-file notes.md
      - name: Remove staging branch
        env: { GH_TOKEN: '${{ github.token }}' }
        run: git push origin --delete "${GITHUB_REF_NAME}"
